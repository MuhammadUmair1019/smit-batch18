<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Prompt</title>
    <style>
      body {
        max-width: 640px;
        margin: 48px auto;
        padding: 0 16px;
        font-family: Arial, sans-serif;
      }

      textarea {
        box-sizing: border-box;
        width: 100%;
        min-height: 120px;
        margin: 8px 0;
        padding: 10px;
        font: inherit;
      }

      button {
        padding: 10px 16px;
        cursor: pointer;
      }

      #response {
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      #response pre {
        overflow-x: auto;
        padding: 12px;
        background: #f3f3f3;
      }

      #response code {
        font-family: Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <h1>Ask Gemini</h1>

    <form id="prompt-form">
      <label for="prompt">Your prompt</label>
      <textarea id="prompt" placeholder="Write a prompt..." required></textarea>
      <button id="submit-button" type="submit">Send prompt</button>
    </form>

    <h2>Response</h2>
    <p id="status" role="status"></p>
    <div id="response"></div>

    <script>
      const form = document.querySelector("#prompt-form");
      const promptInput = document.querySelector("#prompt");
      const submitButton = document.querySelector("#submit-button");
      const status = document.querySelector("#status");
      const responseArea = document.querySelector("#response");

      function escapeHtml(value) {
        return value.replace(/[&<>"']/g, (character) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[character]);
      }

      function formatInline(value) {
        return escapeHtml(value)
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/\*([^*]+)\*/g, "<em>$1</em>");
      }

      function renderMarkdown(markdown) {
        const output = [];
        let paragraph = [];
        let list = "";
        let inCodeBlock = false;

        function flushParagraph() {
          if (paragraph.length) {
            output.push(`<p>${paragraph.map(formatInline).join(" ")}</p>`);
            paragraph = [];
          }
        }

        function closeList() {
          if (list) {
            output.push(`</${list}>`);
            list = "";
          }
        }

        for (const line of markdown.split(/\r?\n/)) {
          if (line.trim().startsWith("```")) {
            flushParagraph();
            closeList();
            output.push(inCodeBlock ? "</code></pre>" : "<pre><code>");
            inCodeBlock = !inCodeBlock;
          } else if (inCodeBlock) {
            output.push(`${escapeHtml(line)}\n`);
          } else {
            const heading = line.match(/^(#{1,3})\s+(.+)$/);
            const bullet = line.match(/^\s*[-*]\s+(.+)$/);
            const numbered = line.match(/^\s*\d+\.\s+(.+)$/);

            if (!line.trim()) {
              flushParagraph();
              closeList();
            } else if (heading) {
              flushParagraph();
              closeList();
              const level = heading[1].length;
              output.push(`<h${level}>${formatInline(heading[2])}</h${level}>`);
            } else if (bullet || numbered) {
              flushParagraph();
              const nextList = bullet ? "ul" : "ol";
              if (list !== nextList) {
                closeList();
                output.push(`<${nextList}>`);
                list = nextList;
              }
              output.push(`<li>${formatInline((bullet || numbered)[1])}</li>`);
            } else {
              closeList();
              paragraph.push(line.trim());
            }
          }
        }

        flushParagraph();
        closeList();
        if (inCodeBlock) output.push("</code></pre>");
        return output.join("");
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submitButton.disabled = true;
        status.textContent = "Thinking...";
        responseArea.textContent = "";

        try {
          const result = await fetch("http://localhost:3000/api/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: promptInput.value }),
          });

          const data = await result.json();
          if (!result.ok) {
            throw new Error(data.error || "The request failed.");
          }

          responseArea.innerHTML = renderMarkdown(data.response);
          status.textContent = "";
        } catch (error) {
          status.textContent = error.message;
        } finally {
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
